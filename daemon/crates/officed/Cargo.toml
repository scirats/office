[package]
name = "officed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { workspace = true }
execution = { workspace = true }
broker = { workspace = true }
workspace = { path = "../workspace" }
agent = { workspace = true }
tool = { workspace = true }
toolbox = { workspace = true }
reconciliation = { path = "../reconciliation" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "1.27.0", features = ["v7"] }
thiserror = "2.0.21"
serde = "1.0.229"
rusqlite = { version = "0.40.2", features = ["bundled"] }
