[package]
name = "officed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { workspace = true }
execution = { workspace = true }
broker = { workspace = true }
workspace = { path = "../workspace" }
project = { path = "../project" }
agent = { workspace = true }
tool = { workspace = true }
toolbox = { workspace = true }
model = { workspace = true }
inference = { workspace = true }
runner = { workspace = true }
sandbox = { workspace = true }
secret = { workspace = true }
reconciliation = { path = "../reconciliation" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "1.27.0", features = ["v7"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
nix = { version = "0.30", features = ["signal", "process"] }
landlock = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
