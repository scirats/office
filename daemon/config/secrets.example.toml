# Office secrets — example.
#
# Install at /etc/office/secrets.toml with mode 0600:
#   install -m 600 secrets.example.toml /etc/office/secrets.toml
#
# Keys must match each provider's `credential_ref` in models.toml. Values never
# appear in logs, the database, or the wire; they are resolved server-side and
# injected per execution (docs/03 §49-51).

[secrets]
"provider/anthropic" = "sk-ant-REPLACE_ME"
"provider/openai" = "sk-REPLACE_ME"
"provider/deepseek" = "sk-REPLACE_ME"
"provider/local" = "local-no-auth"
