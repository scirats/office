[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/execution",
    "crates/broker",
    "crates/workspace",
    "crates/project",
    "crates/agent",
    "crates/tool",
    "crates/toolbox",
    "crates/model",
    "crates/inference",
    "crates/runner",
    "crates/sandbox",
    "crates/secret",
    "crates/reconciliation",
    "crates/officed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
execution = { path = "crates/execution" }
broker = { path = "crates/broker" }
workspace = { path = "crates/workspace" }
project = { path = "crates/project" }
agent = { path = "crates/agent" }
tool = { path = "crates/tool" }
toolbox = { path = "crates/toolbox" }
model = { path = "crates/model" }
inference = { path = "crates/inference" }
runner = { path = "crates/runner" }
sandbox = { path = "crates/sandbox" }
secret = { path = "crates/secret" }
reconciliation = { path = "crates/reconciliation" }
